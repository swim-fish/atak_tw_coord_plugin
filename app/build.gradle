////////////////////////////////////////////////////////////////////////////////
// atak_tw_power_plugin — Taiwan coordinate display plugin for ATAK-CIV
//
// PLUGIN_VERSION  — common version name for this plugin
// ATAK_VERSION    — the ATAK runtime this plugin targets
////////////////////////////////////////////////////////////////////////////////

buildscript {
    ext.PLUGIN_VERSION = "1.0.0"
    ext.ATAK_VERSION = "5.7.0.3"

    def takdevVersion = "3.+"

    ext.getValueFromPropertiesFile = { propFile, key ->
        if (!propFile.isFile() || !propFile.canRead()) return null
        def prop = new Properties()
        def reader = propFile.newReader()
        try {
            prop.load(reader)
        } finally {
            reader.close()
        }
        return prop.get(key)
    }

    def getProperty = { name, defValue ->
        def prop = project.properties[name] ?:
                getValueFromPropertiesFile(project.rootProject.file('local.properties'), name)
        return (null == prop) ? defValue : prop
    }

    def urlKey = 'takrepo.url'
    ext.isDevKitEnabled = { -> return getProperty(urlKey, null) != null }
    ext.takrepoUrl = getProperty(urlKey, 'https://localhost/')
    ext.takrepoUser = getProperty('takrepo.user', 'invalid')
    ext.takrepoPassword = getProperty('takrepo.password', 'invalid')
    ext.takdevPlugin = getProperty('takdev.plugin',
            "${rootDir}/../ATAK-CIV-5.7.0.3-SDK/atak-gradle-takdev.jar")

    repositories {
        google()
        mavenCentral()
        mavenLocal()
        maven { url "https://jitpack.io" }
        maven {
            url = takrepoUrl
            credentials {
                username = takrepoUser
                password = takrepoPassword
            }
        }
    }
    dependencies {
        if (isDevKitEnabled()) {
            classpath "com.atakmap.gradle:atak-gradle-takdev:${takdevVersion}"
        } else {
            classpath files(takdevPlugin)
        }
    }
}

plugins {
    id("com.android.application")
    id("com.diffplug.spotless")
}
apply {
    plugin("atak-takdev-plugin")
}

allprojects {
    repositories {
        mavenCentral()
        google()
        mavenCentral()
        mavenLocal()
        maven { url = uri("https://jitpack.io") }
    }
}

def supportedFlavors = [
        [name: 'civ', default: true],
]

android {
    compileSdk 36
    namespace 'com.atakmap.android.twpower.plugin'

    buildFeatures {
        buildConfig = true
    }

    bundle {
        storeArchive { enable = false }
    }

    packagingOptions {
        jniLibs { useLegacyPackaging = true }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lintOptions {
        checkReleaseBuilds true
        abortOnError true
    }

    signingConfigs {
        debug {
            storeFile file("${buildDir}/android_keystore")
            storePassword "tnttnt"
            keyAlias "wintec_mapping"
            keyPassword "tnttnt"
        }
        release {
            storeFile file("${buildDir}/android_keystore")
            storePassword "tnttnt"
            keyAlias "wintec_mapping"
            keyPassword "tnttnt"
        }
    }

    buildTypes {
        debug {
            debuggable true
            matchingFallbacks = ['sdk']
        }
        release {
            minifyEnabled true
            proguardFile 'proguard-gradle.txt'
            signingConfig signingConfigs.release
            matchingFallbacks = ['odk']
        }
    }

    flavorDimensions "application"

    productFlavors {
        supportedFlavors.each { flav ->
            "${flav.name}" {
                getIsDefault().set(flav.default)
                dimension "application"

                if (!flav.name.equals("civ") && !flav.name.equals("mil")) {
                    applicationIdSuffix = ".${flav.name}"
                }
                matchingFallbacks = ['civ']

                def pluginApiFlavor = flav.name.equals('gov') ? 'CIV' : "${flav.name.toUpperCase()}"
                manifestPlaceholders = [atakApiVersion: "com.atakmap.app@" + ATAK_VERSION + ".${pluginApiFlavor}"]
            }
        }
        applicationVariants.all { variant ->
            variant.resValue "string", "versionName", variant.versionName
            buildConfigField 'String', 'ATAK_PACKAGE_NAME', '"com.atakmap.app.civ"'
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/INDEX.LIST']
        }
        jniLibs.useLegacyPackaging true
    }

    sourceSets {
        main {
            setProperty("archivesBaseName",
                    "ATAK-Plugin-" + rootProject.name + "-" + PLUGIN_VERSION + "-" +
                            getVersionName() + "-" + ATAK_VERSION)
            defaultConfig.versionCode = getVersionCode()
            defaultConfig.versionName = PLUGIN_VERSION + " (" + getVersionName() + ") - [" +
                    ATAK_VERSION + "]"
        }
        debug.setRoot('build-types/debug')
        release.setRoot('build-types/release')
    }

    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 34

        def runTasks = gradle.startParameter.taskNames
        if (runTasks.toString().contains('bundle')) {
            ndk { abiFilters "armeabi-v7a", "arm64-v8a" }
        } else {
            ndk { abiFilters "armeabi-v7a", "arm64-v8a", "x86" }
        }
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

afterEvaluate {
    project.file('proguard-gradle-repackage.txt').text =
            "-repackageclasses atakplugin.${rootProject.getName()}"
}

dependencies {
    implementation fileTree(dir: 'libs', include: '*.jar')

    // Coordinate math (TWD97 / EPSG:3826). proj4j is pure-Java, zero Android transitives.
    implementation 'org.locationtech.proj4j:proj4j:1.3.0'

    // JVM unit tests (TDD inner loop, pure Java; no Android runtime needed).
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.assertj:assertj-core:3.27.3'
    testImplementation 'org.mockito:mockito-core:5.16.1'

    // Instrumented tests (Android device / emulator required).
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Match ATAK-bundled AndroidX versions; precedent: meshtastic_atak.
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'androidx.core' && !details.requested.name.contains('core-viewtree')) {
            details.useVersion "1.17.0"
        }
        if (details.requested.group == 'androidx.lifecycle') {
            details.useVersion "2.9.4"
        }
        if (details.requested.group == 'androidx.fragment') {
            details.useVersion "1.8.9"
        }
    }
}

configurations.implementation {
    exclude group: 'androidx.core', module: 'core-ktx'
    exclude group: 'androidx.core', module: 'core'
    exclude group: 'androidx.fragment', module: 'fragment'
    exclude group: 'androidx.lifecycle', module: 'lifecycle'
    exclude group: 'androidx.lifecycle', module: 'lifecycle-process'
}

// Constitution Principle I — formatter is enforced by the build, not goodwill.
spotless {
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java',
                'src/androidTest/java/**/*.java'
        googleJavaFormat('1.22.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}
tasks.named('check') { dependsOn 'spotlessCheck' }
