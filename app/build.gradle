////////////////////////////////////////////////////////////////////////////////
// atak_tw_coord_plugin — Taiwan coordinate display plugin for ATAK-CIV
//
// PLUGIN_VERSION  — common version name for this plugin
// ATAK_VERSION    — the ATAK runtime this plugin targets
////////////////////////////////////////////////////////////////////////////////

buildscript {
    ext.PLUGIN_VERSION = "1.0.1"
    // ATAK_VERSION drives the plugin-api meta-data string in AndroidManifest.xml.
    // We target 5.4.0 to maximise device compatibility — meshtastic ships 5.4.0 and works
    // unchanged on every ATAK-CIV release we have access to (5.4..5.7). Compile-time SDK
    // stays at 5.7.0.3 via sdk.path in local.properties; only the runtime compatibility
    // declaration is 5.4.0. See ADR-0007.
    ext.ATAK_VERSION = "5.4.0"

    def takdevVersion = "3.+"

    ext.getValueFromPropertiesFile = { propFile, key ->
        if (!propFile.isFile() || !propFile.canRead()) return null
        def prop = new Properties()
        def reader = propFile.newReader()
        try {
            prop.load(reader)
        } finally {
            reader.close()
        }
        return prop.get(key)
    }

    def getProperty = { name, defValue ->
        def prop = project.properties[name] ?:
                getValueFromPropertiesFile(project.rootProject.file('local.properties'), name)
        return (null == prop) ? defValue : prop
    }

    def urlKey = 'takrepo.url'
    ext.isDevKitEnabled = { -> return getProperty(urlKey, null) != null }
    ext.takrepoUrl = getProperty(urlKey, 'https://localhost/')
    ext.takrepoUser = getProperty('takrepo.user', 'invalid')
    ext.takrepoPassword = getProperty('takrepo.password', 'invalid')
    ext.takdevPlugin = getProperty('takdev.plugin',
            "${rootDir}/../ATAK-CIV-5.7.0.3-SDK/atak-gradle-takdev.jar")

    repositories {
        google()
        mavenCentral()
        mavenLocal()
        maven { url "https://jitpack.io" }
        maven {
            url = takrepoUrl
            credentials {
                username = takrepoUser
                password = takrepoPassword
            }
        }
    }
    dependencies {
        if (isDevKitEnabled()) {
            classpath "com.atakmap.gradle:atak-gradle-takdev:${takdevVersion}"
        } else {
            classpath files(takdevPlugin)
        }
    }
}

plugins {
    id("com.android.application")
    id("com.diffplug.spotless")
}
apply {
    plugin("atak-takdev-plugin")
}

allprojects {
    repositories {
        mavenCentral()
        google()
        mavenCentral()
        mavenLocal()
        maven { url = uri("https://jitpack.io") }
    }
}

def supportedFlavors = [
        [name: 'civ', default: true],
]

// Project-scope helper for reading local.properties (the buildscript-block
// helper above can't be reused from inside `android { ... }` because it lives
// in the buildscript closure).
def loadLocalProperty = { String name, String defValue ->
    def fromProject = project.properties[name]
    if (fromProject != null) return fromProject
    def fromFile = ext.getValueFromPropertiesFile(rootProject.file('local.properties'), name)
    return fromFile != null ? fromFile : defValue
}

// Release signing config sourced from local.properties (gitignored). Falls
// back to no signing — the build still compiles and produces an unsigned APK,
// which is what TAK Third Party Pipeline (TPP) submissions need (TPP re-signs
// with the Government third-party cert downstream).
def releaseStoreFile = loadLocalProperty('releaseStoreFile', null)
def releaseStorePassword = loadLocalProperty('releaseStorePassword', null)
def releaseKeyAlias = loadLocalProperty('releaseKeyAlias', null)
def releaseKeyPassword = loadLocalProperty('releaseKeyPassword', null)
def haveReleaseKeystore = releaseStoreFile != null &&
        rootProject.file(releaseStoreFile.toString()).exists() &&
        releaseStorePassword != null && releaseKeyAlias != null && releaseKeyPassword != null

android {
    compileSdk 36
    namespace 'com.atakmap.android.twcoord.plugin'

    buildFeatures {
        buildConfig = true
    }

    bundle {
        storeArchive { enable = false }
    }

    packagingOptions {
        jniLibs { useLegacyPackaging = true }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lintOptions {
        checkReleaseBuilds true
        abortOnError true
    }

    testOptions {
        // Android stub jars in the unit-test classpath throw `RuntimeException("not mocked")` on
        // any method call by default. Setting returnDefaultValues=true makes them return
        // null/0/false instead, which is what JVM unit tests assume when they don't bring in
        // Robolectric. Required for tests that touch Android types they don't fully mock — e.g.
        // any code path calling `com.atakmap.coremap.log.Log.w(...)` inside the code under test.
        unitTests.returnDefaultValues = true
    }

    // Debug variant uses Android's default debug keystore (~/.android/debug.keystore,
    // auto-generated by AGP on first build). No custom signing config needed.
    //
    // Release variant pulls its keystore + passwords from local.properties via
    // loadLocalProperty(...) above. When haveReleaseKeystore is false the build
    // still compiles and produces an UNSIGNED release APK — that's intentional so
    // (a) CI builds without secrets still verify the source compiles, and (b) TPP
    // submissions don't need a local release key (TPP re-signs downstream).
    signingConfigs {
        if (haveReleaseKeystore) {
            release {
                storeFile rootProject.file(releaseStoreFile.toString())
                storePassword releaseStorePassword.toString()
                keyAlias releaseKeyAlias.toString()
                keyPassword releaseKeyPassword.toString()
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            matchingFallbacks = ['sdk']
        }
        release {
            minifyEnabled true
            proguardFile 'proguard-gradle.txt'
            matchingFallbacks = ['odk']
            if (haveReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    flavorDimensions "application"

    productFlavors {
        supportedFlavors.each { flav ->
            "${flav.name}" {
                getIsDefault().set(flav.default)
                dimension "application"

                if (!flav.name.equals("civ") && !flav.name.equals("mil")) {
                    applicationIdSuffix = ".${flav.name}"
                }
                matchingFallbacks = ['civ']

                def pluginApiFlavor = flav.name.equals('gov') ? 'CIV' : "${flav.name.toUpperCase()}"
                manifestPlaceholders = [atakApiVersion: "com.atakmap.app@" + ATAK_VERSION + ".${pluginApiFlavor}"]
            }
        }
        applicationVariants.all { variant ->
            variant.resValue "string", "versionName", variant.versionName
            buildConfigField 'String', 'ATAK_PACKAGE_NAME', '"com.atakmap.app.civ"'
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/INDEX.LIST']
        }
        jniLibs.useLegacyPackaging true
    }

    sourceSets {
        main {
            setProperty("archivesBaseName",
                    "ATAK-Plugin-" + rootProject.name + "-" + PLUGIN_VERSION + "-" +
                            getVersionName() + "-" + ATAK_VERSION)
            defaultConfig.versionCode = getVersionCode()
            defaultConfig.versionName = PLUGIN_VERSION + " (" + getVersionName() + ") - [" +
                    ATAK_VERSION + "]"
        }
        debug.setRoot('build-types/debug')
        release.setRoot('build-types/release')
    }

    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 34

        def runTasks = gradle.startParameter.taskNames
        if (runTasks.toString().contains('bundle')) {
            ndk { abiFilters "armeabi-v7a", "arm64-v8a" }
        } else {
            ndk { abiFilters "armeabi-v7a", "arm64-v8a", "x86" }
        }
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

afterEvaluate {
    project.file('proguard-gradle-repackage.txt').text =
            "-repackageclasses atakplugin.${rootProject.getName()}"
}

dependencies {
    implementation fileTree(dir: 'libs', include: '*.jar')

    // Coordinate math (TWD97 / EPSG:3826). proj4j is pure-Java, zero Android transitives.
    implementation 'org.locationtech.proj4j:proj4j:1.3.0'

    // JVM unit tests (TDD inner loop, pure Java; no Android runtime needed).
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.assertj:assertj-core:3.27.3'
    testImplementation 'org.mockito:mockito-core:5.16.1'

    // Instrumented tests (Android device / emulator required).
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Match ATAK-bundled AndroidX versions; precedent: meshtastic_atak.
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'androidx.core' && !details.requested.name.contains('core-viewtree')) {
            details.useVersion "1.17.0"
        }
        if (details.requested.group == 'androidx.lifecycle') {
            details.useVersion "2.9.4"
        }
        if (details.requested.group == 'androidx.fragment') {
            details.useVersion "1.8.9"
        }
    }
}

configurations.implementation {
    exclude group: 'androidx.core', module: 'core-ktx'
    exclude group: 'androidx.core', module: 'core'
    exclude group: 'androidx.fragment', module: 'fragment'
    exclude group: 'androidx.lifecycle', module: 'lifecycle'
    exclude group: 'androidx.lifecycle', module: 'lifecycle-process'
}

// Constitution Principle I — formatter is enforced by the build, not goodwill.
spotless {
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java',
                'src/androidTest/java/**/*.java'
        googleJavaFormat('1.22.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}
tasks.named('check') { dependsOn 'spotlessCheck' }
