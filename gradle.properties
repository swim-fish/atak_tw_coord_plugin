org.gradle.jvmargs=-Xms256m -Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
org.gradle.caching=false

ABI_FILTERS=arm64-v8a

# Release signing is read from `local.properties` (see local.properties.example
# + keystore/README.md). Per ADR-0013, the legacy `tak{Debug,Release}Key*`
# template defaults that used to live here were removed because they are not
# consulted by the signingConfigs and looked like committed credentials.
